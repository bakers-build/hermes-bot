# Hermes configuration of the PM bot, for the Hermes version its image is built on (Dockerfile).
# The container's entrypoint renders it into $HERMES_HOME/config.yaml on every start, filling
# each dollar-brace placeholder from the env. Nothing customer-specific belongs here: it all
# comes from the env.
# tests/contract/pm-bot.sh asserts the lock-down below.

# The Hermes config schema version this file is written for; without it Hermes
# refuses to load or migrate the file.
_config_version: 51

model:
  provider: anthropic
  default: ${PM_BOT_MODEL}
  # https://api.anthropic.com (entrypoint.sh's default); the end-to-end test's scripted model
  # sets another (tests/e2e).
  base_url: ${PM_BOT_MODEL_BASE_URL}

# Slack over Socket Mode; the bot and app tokens are read from $HERMES_HOME/.env.
# Users: every user in the allowed channels by default (entrypoint.sh exports
# GATEWAY_ALLOW_ALL_USERS=true unless SLACK_ALLOWED_USERS is set); with SLACK_ALLOWED_USERS
# only those. Hermes reads both from the environment, not from this file.
# Channels: the bot-channels plugin (plugins.enabled below) turns a mention in the bot's
# channel into a request channel and admits only the bot's own open channels, where it
# answers without a mention, flat. A thread from before channels is still answered there.
slack:
  allowed_channels: ${SLACK_ALLOWED_CHANNELS}
  # Slash commands only for the operators; customers keep /help and /whoami.
  allow_admin_from: ${SLACK_ADMIN_USERS}
  group_allow_admin_from: ${SLACK_ADMIN_USERS}
  require_mention: true
  thread_require_mention: false
  reply_in_thread: false

# The text the model writes beside its tool calls is a working note, not an answer: it stays out
# of Slack, so the requester reads results and questions, in the bot's language.
display:
  platforms:
    slack:
      interim_assistant_messages: false

# One shared session per channel: everyone in a request channel sees the same conversation.
group_sessions_per_user: false

# Only the bot's own plugin, which entrypoint.sh copies from the image on every start.
plugins:
  enabled:
    - bot-channels

platform_toolsets:
  slack:
    - skills
    - memory
    - session_search
    - mcp-clone-reader
    - mcp-bakers
  # Hermes' CLI, through which the end-to-end test talks to the bot (entrypoint.sh agent):
  # the same toolsets as in Slack.
  cli:
    - skills
    - memory
    - session_search
    - mcp-clone-reader
    - mcp-bakers
  # The nightly composer-audit job (entrypoint.sh registers it; its skill is skills/composer-audit):
  # a shell in the clone for `composer audit`, the bakers tools for the ticket, and the plugin's
  # tool that opens the ticket's channel. Only cron gets these; Slack keeps the list above.
  cron:
    - terminal
    - skills
    - mcp-bakers
    - bot-channels-cron
# Hermes enables a plugin's toolset on every platform unless the platform lists it here and
# leaves it out of its own list: Slack and the CLI do not get the cron job's channel tool.
known_plugin_toolsets:
  slack:
    - bot-channels-cron
  cli:
    - bot-channels-cron

# The cron job's shell. It starts in the read-only clone and needs only its skill's commands
# (cat, date, find, grep, composer audit), none of which takes a variable. The deny globs keep the run's own commands away
# from the env, the env file and the web; they slow a misled run down and are no sandbox
# (README.md › The nightly Composer audit › The shell). An unattended run has nobody to approve a dangerous command,
# so it is refused at once.
terminal:
  cwd: ${PM_BOT_CLONE_DIR}
approvals:
  cron_mode: deny
  deny:
    - "*.env*"
    - "env"
    - "env *"
    - "*printenv*"
    # environ as a whole word at the end (/proc/<pid>/environ); environment_indicator stays readable.
    - "*environ"
    - '*environ[ ;|&)''"<>]*'
    - "export"
    - "export *"
    - "set"
    - "declare *"
    - "*$*"
    # curl and php as the command itself, in the usual ways it is called (by path too, behind xargs
    # or find -exec); a package or directory whose name only contains the word (php-http/curl-client,
    # php81_bc/strftime, ./php, ./docker/php) stays readable.
    - "curl*"
    - '*[ ;|&(`''"]curl'
    - '*[ ;|&(`''"]curl *'
    - "/*/curl*"
    - "*/bin/curl*"
    - "*wget*"
    - "*node -e*"
    - "*node -p*"
    - "*node --e*"
    - "*node --p*"
    - "*python*"
    - "php*"
    - '*[ ;|&(`''"]php'
    - "*[ ;|&(`']php[ .0-9]*"
    # After a double quote only php itself, with or without a version or Debian's .default
    # suffix: "php81_bc/... is a package.
    - '*"php *'
    - '*"php"*'
    - '*"php[0-9].[0-9]*'
    - '*"php.default*'
    - "/*/php*"
    - "*/bin/php"
    - "*/bin/php[ .0-9]*"

# The cron job's answer goes into the main channel as written: one line, or nothing on
# [SILENT]. A night the container was down catches up when it starts within two hours (Hermes'
# grace window for a daily job); a start any later skips that night with a log line.
cron:
  wrap_response: false
  catch_up_missed: false

agent:
  # Every toolset that can change the system or reach beyond bakers.build's tools and
  # the read-only clone. Code access goes through the clone-reader MCP server instead
  # of the file toolset, which cannot be limited to one directory. The terminal is not
  # listed: Hermes applies this list to cron runs too, and only platform_toolsets.cron
  # names it.
  disabled_toolsets:
    - code_execution
    - browser
    - web
    - delegation
    - file
    - cronjob
    - computer_use
    - kanban
    - todo
    - vision
    - image_gen
    - video_gen
    - tts
    - x_search
    - search
    - connections
    - catalog

# What the bot learns waits for the operator: /memory pending, /skills pending.
memory:
  write_approval: true
skills:
  write_approval: true

mcp_servers:
  # The customer's code, read-only: the filesystem server may only see the
  # secret-free clone, and only its read tools are exposed.
  clone-reader:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem@2026.8.31"
      - ${PM_BOT_CLONE_DIR}
    tools:
      resources: false
      prompts: false
      include:
        - read_text_file
        - list_directory
        - directory_tree
        - search_files
        - get_file_info

  # bakers.build: its own MCP endpoint, the bot's only way in. The service account's API
  # key is the bearer; Hermes fills ${env:BAKERS_API_KEY} from $HERMES_HOME/.env, and the
  # entrypoint's render leaves that form alone, so the key never lands in this file.
  # Exactly the nine tools bb-create-ticket, the status reads, the answer path and the
  # nightly audit (bakers_conductor_list) call.
  bakers:
    url: ${BAKERS_URL}/mcp
    headers:
      Authorization: "Bearer ${env:BAKERS_API_KEY}"
    tools:
      resources: false
      prompts: false
      include:
        - tool_api__bakers_ticket_create
        - tool_api__bakers_ticket_read
        - tool_api__bakers_ticket_search
        - tool_api__bakers_ticket_update
        - tool_api__bakers_ticket_transition
        - tool_api__bakers_comment_create
        - tool_api__bakers_conductor_list
        - tool_api__bakers_ticket_classify
        - tool_api__bakers_user_read
