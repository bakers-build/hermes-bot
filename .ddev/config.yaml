# The PM bot's end-to-end stack for testing by hand: `ddev e2e up` (the first time; then also
# `ddev start`) runs tests/e2e's stack (the site,
# pm-bot in mode agent, the conductor, the scripted model and the Slack recorder) through
# docker-compose.e2e.yaml, seeds the site and starts the bot with a real model. README.md › End-to-end
# test › On the local stack. ddev's own web container idles; there is no ddev database.
name: hermes-bot
type: generic
omit_containers: [db]
performance_mode: none
disable_upload_dirs_warning: true
hooks:
  # The model key in .ddev/.env.e2e and the bot's image, before anything starts.
  pre-start:
    - exec-host: env E2E_DDEV=1 tests/e2e/run.sh ddev-check
  # Seed the site, write the bot's env file, then start the bot and the conductor.
  post-start:
    - exec-host: env E2E_DDEV=1 tests/e2e/run.sh ddev-seed
# The site installs on its first start, slowly where its amd64 images run emulated.
default_container_timeout: "600"
