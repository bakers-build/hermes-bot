# The ddev parts of the end-to-end stack (docker-compose.e2e.yaml): the site at
# https://hermes-bot.ddev.site:33443 through ddev's router, under that one name for the browser and
# for the containers; the bot and the conductor wait for the post-start hook, which seeds the site
# first (tests/e2e/run.sh ddev-seed).
services:
  nginx:
    # The name ddev's router sends the site's requests to.
    container_name: ddev-hermes-bot-nginx
    environment:
      VIRTUAL_HOST: hermes-bot.ddev.site
      HTTP_EXPOSE: 33080:80
      HTTPS_EXPOSE: 33443:80
    networks:
      default:
        aliases: [hermes-bot.ddev.site]
  pm-bot:
    profiles: [seeded]
  conductor:
    profiles: [seeded]
  # ddev waits for every project container to be running, so the two one-shots stay up after their
  # work and report it as healthy; what waited for their exit waits for that instead.
  init-perms:
    command: sh -c "chown -R 1000:1000 /pf /privf /oauthkeys && chown 1000:1000 /tmpdir && chmod 1777 /tmpdir && touch /done && exec sleep infinity"
    healthcheck:
      test: [CMD, test, -f, /done]
      interval: 2s
      retries: 300
  deploy:
    command: sh -c "/var/www/html/scripts/deploy/site-deploy.sh && touch /tmp/e2e-deployed && exec sleep infinity"
    depends_on: !override
      init-perms:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -f, /tmp/e2e-deployed]
      interval: 5s
      retries: 200
  php:
    depends_on: !override
      init-perms:
        condition: service_healthy
      db:
        condition: service_healthy
      deploy:
        condition: service_healthy
